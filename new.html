<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEDCORE Hub 🩺 | الأدوات الطبية وساحة التحدي</title>
    <link rel="stylesheet" href="style.css">
    <!-- مكتبات Firebase الرسمية -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js" crossorigin="anonymous"></script>
    <!-- قواعد بيانات القيم المعملية (589 تحليلاً) والحاسبات الطبية (37 حاسبة) والمصطلحات -->
    <script src="medcore-labs.js"></script>
    <script src="medcore-tools.js"></script>
    <style>
        body { padding-bottom: 30px; }
        .hub-tabs-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 10px 12px;
            background: var(--surface-glass);
            border-bottom: 2px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 900;
        }
        .hub-tab-btn {
            background: var(--surface-elevated);
            color: var(--text);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 14px;
            font-weight: 800;
            font-size: 0.84rem;
            cursor: pointer;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.18s ease;
        }
        .hub-tab-btn.active {
            background: var(--maroon);
            color: #ffffff;
            border-color: var(--gold);
        }
        .cat-pills-strip {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 6px 2px 10px 2px;
            margin-bottom: 10px;
        }
        .cat-pill-btn {
            background: var(--surface-elevated);
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 0.78rem;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.15s;
        }
        .cat-pill-btn.active {
            background: var(--gold);
            color: #0b1322;
            border-color: var(--gold);
        }
        .lab-item-card {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-right: 4px solid var(--primary);
            border-radius: var(--radius-md);
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
        }
        .lab-range-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            border-radius: 6px;
            background: var(--surface-elevated);
            margin-bottom: 5px;
            font-size: 0.85rem;
            gap: 8px;
            flex-wrap: wrap;
        }
        .lab-range-row.crit-low, .lab-range-row.crit-high {
            background: var(--error-light);
            border: 1px solid var(--error);
            color: var(--error);
            font-weight: 900;
        }
        .calc-grid-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 14px;
            align-items: start;
        }
        .calc-list-sidebar {
            max-height: 70vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-inline-end: 4px;
        }
        .calc-item-btn {
            width: 100%;
            text-align: start;
            padding: 9px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: var(--surface-elevated);
            color: var(--text);
            font-weight: 800;
            font-size: 0.82rem;
            cursor: pointer;
            transition: 0.15s;
        }
        .calc-item-btn.active {
            border-color: var(--gold);
            background: rgba(197, 160, 89, 0.22);
            color: var(--gold-bright);
        }
        body.light-theme .calc-item-btn.active {
            color: var(--maroon);
        }
        .mnemonic-chips-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0 12px 0;
        }
        @media (max-width: 720px) {
            .calc-grid-layout {
                grid-template-columns: 1fr;
            }
            .calc-list-sidebar {
                max-height: 195px;
                border-bottom: 2px solid var(--border);
                padding-bottom: 8px;
            }
        }
    </style>
</head>
<body>

    <!-- شريط التبويبات العلوي لبوابة الأدوات -->
    <header class="hub-tabs-bar">
        <button type="button" class="hub-tab-btn" id="tab-btn-labs" onclick="switchHubTab('labs')">
            🧪 <span data-i18n="labsBtn">القيم المعملية</span> (589)
        </button>
        <button type="button" class="hub-tab-btn" id="tab-btn-calc" onclick="switchHubTab('calc')">
            🧮 <span data-i18n="calcBtn">الحاسبات الطبية</span> (37)
        </button>
        <button type="button" class="hub-tab-btn" id="tab-btn-mnemonic" onclick="switchHubTab('mnemonic')">
            🧠 <span data-i18n="mnemonicBtn">مختصرات الحفظ</span>
        </button>
        <button type="button" class="hub-tab-btn" id="tab-btn-terms" onclick="switchHubTab('terms')">
            📖 <span data-i18n="termsBtn">المصطلحات</span>
        </button>
        <button type="button" class="hub-tab-btn" id="tab-btn-arena" onclick="switchHubTab('arena')">
            ⚔️ <span data-i18n="arenaTab">ساحة التحدي</span>
        </button>
        <div style="margin-inline-start:auto; display:flex; gap:6px;">
            <button type="button" class="hub-tab-btn" onclick="toggleHubLanguage()" id="hub-lang-btn">🌐 EN</button>
        </div>
    </header>

    <main class="container" style="max-width:1020px; margin-top:12px;">

        <!-- =====================================================================
             القسم 1: موسوعة القيم المعملية الشاملة (589 تحليلاً و 35 قسماً)
             ===================================================================== -->
        <section id="hub-sec-labs" class="hub-section" style="display:none;">
            <div class="quiz-card" style="padding:16px;">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
                    <h2 style="margin:0; font-size:1.15rem; color:var(--gold);" id="labs-main-heading">🧪 موسوعة القيم المعملية المرجعية (589 تحليلاً)</h2>
                    <span id="labs-count-badge" class="status-pill">589</span>
                </div>

                <input type="search" id="labs-search-input" placeholder="ابحث باسم التحليل بالعربية أو الإنجليزية أو الاختصار (مثال: Hb, Na, Troponin, TSH, CSF)..." oninput="renderLabsDirectory()" style="width:100%; padding:11px 14px; border-radius:var(--radius-sm); border:1.5px solid var(--border); background:var(--surface-elevated); color:var(--text); font-weight:700; margin-bottom:8px;">

                <!-- شريط الـ 35 قسماً -->
                <div class="cat-pills-strip" id="labs-categories-bar"></div>

                <!-- قائمة البطاقات -->
                <div id="labs-results-container" style="max-height:66vh; overflow-y:auto; padding-inline-end:4px;"></div>
            </div>
        </section>

        <!-- =====================================================================
             القسم 2: الحاسبات الطبية السريرية الشاملة (37 حاسبة تفاعلية)
             ===================================================================== -->
        <section id="hub-sec-calc" class="hub-section" style="display:none;">
            <div class="quiz-card" style="padding:16px;">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
                    <h2 style="margin:0; font-size:1.15rem; color:var(--gold);" id="calc-main-heading">🧮 الحاسبات الطبية السريرية (37 حاسبة)</h2>
                    <input type="search" id="calc-filter-inp" placeholder="ابحث عن حاسبة (GFR, BMI, Wells, MELD, GCS)..." oninput="renderCalculatorsSidebar()" style="width:260px; max-width:100%; padding:8px 12px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--surface-elevated); color:var(--text); font-size:0.84rem;">
                </div>

                <div class="calc-grid-layout">
                    <div class="calc-list-sidebar" id="calc-sidebar-list"></div>
                    <div class="static-section-box" id="calc-active-workspace" style="margin:0; min-height:320px;"></div>
                </div>
            </div>
        </section>

        <!-- =====================================================================
             القسم 3: صانع المختصرات الطبية الذكي (MedMnemonic AI)
             ===================================================================== -->
        <section id="hub-sec-mnemonic" class="hub-section" style="display:none;">
            <div class="quiz-card">
                <h2 style="margin-top:0; color:var(--gold); font-size:1.2rem;" id="mnem-heading">🧠 MedMnemonic AI</h2>
                <p style="font-size:0.86rem; color:var(--text-muted); margin:0 0 10px 0;" id="mnem-sub">حوّل أي قائمة طبية إلى مختصر ذكي لا يُنسى في الامتحان:</p>

                <div style="font-size:0.82rem; font-weight:800; color:var(--gold); margin-bottom:6px;" id="mnem-ex-label">أمثلة جاهزة:</div>
                <div class="mnemonic-chips-wrap">
                    <button type="button" class="btn-chip" onclick="selectPresetMnemonic('Cranial Nerves')">Cranial Nerves</button>
                    <button type="button" class="btn-chip" onclick="selectPresetMnemonic('MUDPILES')">MUDPILES</button>
                    <button type="button" class="btn-chip" onclick="selectPresetMnemonic('CURB-65')">CURB-65</button>
                    <button type="button" class="btn-chip" onclick="selectPresetMnemonic('Child-Pugh')">Child-Pugh</button>
                    <button type="button" class="btn-chip" onclick="selectPresetMnemonic('Hypokalemia')">Hypokalemia</button>
                </div>

                <textarea id="mnem-input-box" rows="3" placeholder="اكتب القائمة الطبية أو أسباب المرض هنا (مثال: Causes of Acute Pancreatitis)..." style="width:100%; padding:11px; border-radius:var(--radius-sm); background:var(--surface-elevated); color:var(--text); border:1.5px solid var(--border); margin-bottom:10px; font-weight:700;"></textarea>

                <div style="display:flex; gap:8px;">
                    <button type="button" id="btn-run-mnemonic" class="btn-nav btn-gold" style="flex:1;" onclick="generateHubMnemonic()">
                        ✨ <span id="mnem-gen-btn-txt">إنشاء Mnemonic</span>
                    </button>
                    <button type="button" class="btn-nav btn-outline" onclick="clearMnemonicBox()">
                        🗑️ <span id="mnem-clear-btn-txt">مسح</span>
                    </button>
                </div>

                <div id="mnem-result-wrapper" style="display:none; margin-top:14px;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                        <b style="color:var(--gold); font-size:0.9rem;" id="mnem-res-label">🎯 المختصر المولَّد:</b>
                        <div style="display:flex; gap:6px;">
                            <button type="button" class="btn-chip" onclick="copyMnemonicResult()">📋 <span data-i18n="copy">نسخ</span></button>
                            <button type="button" class="btn-chip" onclick="generateHubMnemonic(true)">🔄 <span data-i18n="reset">إعادة</span></button>
                        </div>
                    </div>
                    <div id="mnem-output-text" class="explanation-box" style="margin-top:0; white-space:pre-wrap;"></div>
                </div>
            </div>
        </section>

        <!-- =====================================================================
             القسم 4: قاموس المصطلحات والبادئات الطبية (MQ_MED_TERMS)
             ===================================================================== -->
        <section id="hub-sec-terms" class="hub-section" style="display:none;">
            <div class="quiz-card">
                <h2 style="margin-top:0; color:var(--gold); font-size:1.15rem;" id="terms-heading">📖 قاموس المصطلحات والاختصارات الطبية</h2>
                <input type="search" id="terms-search-inp" placeholder="ابحث عن اختصار أو بادئة طبية (مثال: STEMI, DKA, ARDS, tachy-, -itis, -ectomy)..." oninput="renderMedTermsList()" style="width:100%; padding:11px 14px; border-radius:var(--radius-sm); border:1.5px solid var(--border); background:var(--surface-elevated); color:var(--text); font-weight:700; margin-bottom:12px;">
                <div id="terms-results-box" style="max-height:66vh; overflow-y:auto; display:flex; flex-direction:column; gap:10px;"></div>
            </div>
        </section>

        <!-- =====================================================================
             القسم 5: ساحة التحدي المباشر (مقفولة على المحاضرة المفتوحة + بحد أقصى 4 لاعبين)
             ===================================================================== -->
        <section id="hub-sec-arena" class="hub-section" style="display:none;">
            <div id="arena-container-box"></div>
        </section>

    </main>

    <script>
    /* ==========================================================================
       MEDCORE Hub Engine (new.html — Labs, 37 Calculators, Mnemonic AI & Arena)
       ========================================================================== */
    const firebaseConfig = {
        apiKey: "AIzaSyAElUTnaXitLw35Hb55kQWoe1AdbGO1t8A",
        authDomain: "medquiz2026.firebaseapp.com",
        databaseURL: "https://medquiz2026-default-rtdb.europe-west1.firebasedatabase.app/",
        projectId: "medquiz2026",
        storageBucket: "medquiz2026.firebasestorage.app",
        messagingSenderId: "840399052520",
        appId: "1:840399052520:web:1181e6fcd93696b679335d"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const rtdb = firebase.database();

    // رابط السيرفر الرسمي الخاص بك
    const AI_WORKER_ENDPOINT = "https://medcore-ai-proxy.ma7moud01030382018.workers.dev/";

    const urlParams = new URLSearchParams(window.location.search);
    let activeTab = urlParams.get('tab') || 'labs';
    let lockedLectureId = (urlParams.get('lecId') || '').trim();
    let lockedLectureTitle = (urlParams.get('lecTitle') || '').trim();
    let initialArenaRoom = (urlParams.get('room') || '').trim();

    function escapeHTML(str) {
        if (str === null || str === undefined) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function getLang() {
        return localStorage.getItem('mq_lang') || urlParams.get('lang') || 'ar';
    }

    function applyHubThemeAndLang() {
        const theme = localStorage.getItem('mq-theme-v13') || urlParams.get('theme') || 'dark';
        if (theme === 'light') document.body.classList.add('light-theme');
        else document.body.classList.remove('light-theme');

        const lang = getLang();
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.body.style.direction = lang === 'ar' ? 'rtl' : 'ltr';
        document.body.style.textAlign = lang === 'ar' ? 'right' : 'left';

        const langBtn = document.getElementById('hub-lang-btn');
        if (langBtn) langBtn.innerText = lang === 'ar' ? '🌐 EN' : '🌐 عربي';

        const isEn = lang === 'en';
        document.querySelector('[data-i18n="labsBtn"]').innerText = isEn ? 'Lab Values' : 'القيم المعملية';
        document.querySelector('[data-i18n="calcBtn"]').innerText = isEn ? 'Calculators' : 'الحاسبات الطبية';
        document.querySelector('[data-i18n="mnemonicBtn"]').innerText = isEn ? 'Mnemonics' : 'مختصرات الحفظ';
        document.querySelector('[data-i18n="termsBtn"]').innerText = isEn ? 'Med Terms' : 'المصطلحات';
        document.querySelector('[data-i18n="arenaTab"]').innerText = isEn ? 'Live Arena' : 'ساحة التحدي';

        document.getElementById('labs-main-heading').innerText = isEn
            ? `🧪 Clinical Lab Values Reference (${typeof MQ_LABS !== 'undefined' ? MQ_LABS.length : 589} Tests)`
            : `🧪 موسوعة القيم المعملية المرجعية (${typeof MQ_LABS !== 'undefined' ? MQ_LABS.length : 589} تحليلاً)`;
        document.getElementById('labs-search-input').placeholder = isEn
            ? 'Search by test name, abbreviation, or condition (e.g. Hb, Na, Troponin, TSH, CSF)...'
            : 'ابحث باسم التحليل بالعربية أو الإنجليزية أو الاختصار (مثال: Hb, Na, Troponin, TSH, CSF)...';

        document.getElementById('calc-main-heading').innerText = isEn
            ? '🧮 Clinical Medical Calculators (37 Tools)'
            : '🧮 الحاسبات الطبية السريرية (37 حاسبة)';
        document.getElementById('calc-filter-inp').placeholder = isEn
            ? 'Search calculator (GFR, BMI, Wells, MELD, GCS)...'
            : 'ابحث عن حاسبة (GFR, BMI, Wells, MELD, GCS)...';

        document.getElementById('mnem-sub').innerText = isEn
            ? 'Turn any medical list or differential into an unforgettable exam mnemonic:'
            : 'حوّل أي قائمة طبية إلى مختصر ذكي لا يُنسى في الامتحان:';
        document.getElementById('mnem-ex-label').innerText = isEn ? 'Ready Examples:' : 'أمثلة جاهزة:';
        document.getElementById('mnem-input-box').placeholder = isEn
            ? 'Enter medical list or topic here (e.g. Causes of Acute Pancreatitis)...'
            : 'اكتب القائمة الطبية أو أسباب المرض هنا...';
        document.getElementById('mnem-gen-btn-txt').innerText = isEn ? 'Generate Mnemonic' : 'إنشاء Mnemonic';
        document.getElementById('mnem-clear-btn-txt').innerText = isEn ? 'Clear' : 'مسح';
        document.getElementById('mnem-res-label').innerText = isEn ? '🎯 Generated Mnemonic:' : '🎯 المختصر المولَّد:';
        document.getElementById('terms-heading').innerText = isEn
            ? '📖 Medical Terminology & Abbreviations Dictionary'
            : '📖 قاموس المصطلحات والاختصارات الطبية';

        renderLabsCategoriesBar();
        renderLabsDirectory();
        renderCalculatorsSidebar();
        renderActiveCalculatorForm();
        renderMedTermsList();
    }

    function toggleHubLanguage() {
        const nextLang = getLang() === 'ar' ? 'en' : 'ar';
        localStorage.setItem('mq_lang', nextLang);
        if (typeof window.mqSetLang === 'function') window.mqSetLang(nextLang);
        applyHubThemeAndLang();
    }

    window.addEventListener('message', (e) => {
        if (!e.data) return;
        if (e.data.type === 'MQ_SET_LANG') {
            localStorage.setItem('mq_lang', e.data.lang);
            applyHubThemeAndLang();
        } else if (e.data.type === 'MQ_SET_THEME') {
            if (e.data.theme === 'light') document.body.classList.add('light-theme');
            else document.body.classList.remove('light-theme');
        }
    });

    function switchHubTab(tab) {
        activeTab = tab;
        document.querySelectorAll('.hub-section').forEach(s => s.style.display = 'none');
        document.querySelectorAll('.hub-tab-btn').forEach(b => b.classList.remove('active'));

        const sec = document.getElementById(`hub-sec-${tab}`);
        const btn = document.getElementById(`tab-btn-${tab}`);
        if (sec) sec.style.display = 'block';
        if (btn) btn.classList.add('active');

        if (tab === 'arena') initArenaModule();
    }

    // ==========================================================================
    // 1. محرك موسوعة القيم المعملية الشاملة (589 تحليلاً و 35 قسماً من medcore-labs.js)
    // ==========================================================================
    let selectedLabCat = 'all';

    function renderLabsCategoriesBar() {
        const bar = document.getElementById('labs-categories-bar');
        if (!bar || typeof MQ_LAB_CATEGORIES_META === 'undefined') return;
        const isEn = getLang() === 'en';

        let html = `<button type="button" class="cat-pill-btn ${selectedLabCat === 'all' ? 'active' : ''}" onclick="selectLabCategory('all')">${isEn ? 'All Categories (35)' : 'جميع الأقسام (35)'}</button>`;
        Object.keys(MQ_LAB_CATEGORIES_META).forEach(catKey => {
            const c = MQ_LAB_CATEGORIES_META[catKey];
            const label = isEn ? c.name : c.nameAr;
            html += `<button type="button" class="cat-pill-btn ${selectedLabCat === catKey ? 'active' : ''}" onclick="selectLabCategory('${catKey}')">${escapeHTML(label)}</button>`;
        });
        bar.innerHTML = html;
    }

    function selectLabCategory(catKey) {
        selectedLabCat = catKey;
        renderLabsCategoriesBar();
        renderLabsDirectory();
    }

    function renderLabsDirectory() {
        const cont = document.getElementById('labs-results-container');
        if (!cont || typeof MQ_LABS === 'undefined') return;

        const isEn = getLang() === 'en';
        const q = (document.getElementById('labs-search-input')?.value || '').trim().toLowerCase();

        const filtered = MQ_LABS.filter(item => {
            if (selectedLabCat !== 'all' && item.category !== selectedLabCat) return false;
            if (!q) return true;
            const inName = (item.name || '').toLowerCase().includes(q) || (item.nameAr || '').includes(q);
            const inAlias = Array.isArray(item.aliases) && item.aliases.some(a => a.toLowerCase().includes(q));
            const inTags = Array.isArray(item.tags) && item.tags.some(t => t.toLowerCase().includes(q));
            const inSig = (item.significance || '').toLowerCase().includes(q) || (item.significanceAr || '').includes(q);
            return inName || inAlias || inTags || inSig;
        });

        const badge = document.getElementById('labs-count-badge');
        if (badge) badge.innerText = isEn ? `${filtered.length} Tests` : `${filtered.length} تحليل`;

        const slice = filtered.slice(0, 80);
        if (slice.length === 0) {
            cont.innerHTML = `<p style="text-align:center; padding:24px; color:var(--text-muted);">${isEn ? 'No matching lab tests found.' : 'لا توجد تحاليل مطابقة للبحث.'}</p>`;
            return;
        }

        cont.innerHTML = slice.map(item => {
            const catMeta = (typeof MQ_LAB_CATEGORIES_META !== 'undefined' && MQ_LAB_CATEGORIES_META[item.category]) || {};
            const catTitle = isEn ? (catMeta.name || item.category) : (catMeta.nameAr || item.category);
            const primaryTitle = isEn ? item.name : `${item.nameAr} — ${item.name}`;
            const aliasesStr = Array.isArray(item.aliases) && item.aliases.length > 0 ? item.aliases.join(', ') : '';
            const sigText = isEn ? (item.significance || item.significanceAr) : (item.significanceAr || item.significance);

            const rangesHtml = (item.ranges || []).map(r => {
                const isCritLow = r.alert === 'critical_low';
                const isCritHigh = r.alert === 'critical_high';
                const rowClass = isCritLow ? 'crit-low' : isCritHigh ? 'crit-high' : '';
                return `
                    <div class="lab-range-row ${rowClass}">
                        <span style="font-weight:800;" dir="ltr">${escapeHTML(r.group)}</span>
                        <span style="color:var(--gold-bright); font-weight:900; font-family:monospace;" dir="ltr">${escapeHTML(r.value)} ${escapeHTML(r.unit || '')}</span>

    let activeCalcId = 'bmi';

    function getCalcTitle(calcObj) {
        const isEn = getLang() === 'en';
        if (isEn && calcObj.nameEn) return calcObj.nameEn;
        if (!isEn && calcObj.nameAr) return calcObj.nameAr;
        if (typeof mqT === 'function' && calcObj.labelKey) return mqT(calcObj.labelKey);
        return calcObj.id.toUpperCase();
    }

    function renderCalculatorsSidebar() {
        const list = document.getElementById('calc-sidebar-list');
        if (!list) return;
        const q = (document.getElementById('calc-filter-inp')?.value || '').trim().toLowerCase();

        const filtered = CALCULATORS_CATALOG.filter(c => {
            const title = getCalcTitle(c).toLowerCase();
            return !q || title.includes(q) || c.id.includes(q);
        });

        list.innerHTML = filtered.map((c, idx) => `
            <button type="button" class="calc-item-btn ${c.id === activeCalcId ? 'active' : ''}" onclick="selectCalculator('${c.id}')">
                ${idx + 1}. ${escapeHTML(getCalcTitle(c))}
            </button>
        `).join('');
    }

    function selectCalculator(id) {
        activeCalcId = id;
        renderCalculatorsSidebar();
        renderActiveCalculatorForm();
    }

    function renderActiveCalculatorForm() {
        const box = document.getElementById('calc-active-workspace');
        if (!box) return;
        const calc = CALCULATORS_CATALOG.find(c => c.id === activeCalcId) || CALCULATORS_CATALOG[0];
        const isEn = getLang() === 'en';

        let fieldsHtml = calc.fields.map(f => {
            const label = isEn ? f.labelEn : f.labelAr;
            if (f.type === 'checkbox') {
                return `
                    <label style="display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--surface); border:1px solid var(--border); border-radius:6px; cursor:pointer; font-weight:700; margin-bottom:8px;">
                        <input type="checkbox" class="calc-inp-field" data-fid="${f.id}" onchange="executeCurrentCalc()">
                        <span>${escapeHTML(label)}</span>
                    </label>
                `;
            }
            if (f.type === 'select') {
                return `
                    <div style="margin-bottom:10px;">
                        <label style="font-size:0.84rem; font-weight:800; display:block; margin-bottom:4px;">${escapeHTML(label)}:</label>
                        <select class="calc-inp-field" data-fid="${f.id}" onchange="executeCurrentCalc()" style="width:100%; padding:9px; border-radius:6px; background:var(--surface); color:var(--text); border:1px solid var(--border); font-weight:700;">
                            ${(f.opts || []).map(o => `<option value="${escapeHTML(o.v)}">${escapeHTML(isEn ? o.en : o.ar)}</option>`).join('')}
                        </select>
                    </div>
                `;
            }
            return `
                <div style="margin-bottom:10px;">
                    <label style="font-size:0.84rem; font-weight:800; display:block; margin-bottom:4px;">${escapeHTML(label)}:</label>
                    <input type="number" step="any" class="calc-inp-field" data-fid="${f.id}" value="${f.val ?? ''}" oninput="executeCurrentCalc()" style="width:100%; padding:9px; border-radius:6px; background:var(--surface); color:var(--text); border:1px solid var(--border); font-weight:800;">
                </div>
            `;
        }).join('');

        box.innerHTML = `
            <h3 style="margin-top:0; color:var(--gold); border-bottom:1px dashed var(--border); padding-bottom:8px;">🧮 ${escapeHTML(getCalcTitle(calc))}</h3>
            <div>${fieldsHtml}</div>
            <div id="calc-output-card" class="explanation-box" style="margin-top:12px;"></div>
        `;
        executeCurrentCalc();
    }

    function executeCurrentCalc() {
        const calc = CALCULATORS_CATALOG.find(c => c.id === activeCalcId);
        const out = document.getElementById('calc-output-card');
        if (!calc || !out) return;

        const vals = {};
        document.querySelectorAll('.calc-inp-field').forEach(el => {
            const fid = el.dataset.fid;
            if (el.type === 'checkbox') vals[fid] = el.checked;
            else vals[fid] = el.value;
        });

        try {
            const res = calc.run(vals) || {};
            const isEn = getLang() === 'en';
            const mainNumber = res.value ?? res.egfr ?? res.corrected ?? res.ag ?? res.ratio ?? res.calculated ?? res.gap ?? res.score ?? res.total ?? res.totalScore ?? res.convertedValue ?? res.ibw ?? res.bsa ?? res.map ?? res.pp ?? res.totalCo2 ?? res.expected ?? res.gradient ?? res.bmi ?? res.medianSbp ?? res.tdee ?? '';
            const mainText = isEn
                ? (res.interpretation || res.interpretationEn || res.notesEn || res.riskEn || res.recommendationEn || res.severityEn || res.description || res.mortalityEn || res.classification || '')
                : (res.interpretationAr || res.notesAr || res.classAr || res.stageAr || res.riskAr || res.recommendationAr || res.severityAr || res.descriptionAr || res.mortalityAr || res.interpretation || '');

            out.innerHTML = `
                <div style="font-size:1.5rem; font-weight:900; color:${res.color || 'var(--gold)'}; margin-bottom:4px;" dir="ltr">
                    Result: ${escapeHTML(String(mainNumber))} ${escapeHTML(res.unit || res.ckdStage || res.classification || '')}
                </div>
                <div style="font-weight:700; line-height:1.6;">${escapeHTML(mainText)}</div>
            `;
        } catch (e) {
            out.innerText = 'يرجى التحقق من القيم المدخلة.';
        }
    }

    function selectPresetMnemonic(key) {
        const inp = document.getElementById('mnem-input-box');
        const wrap = document.getElementById('mnem-result-wrapper');
        const out = document.getElementById('mnem-output-text');
        inp.value = key;
        if (PRESET_MNEMONICS[key]) {

            out.innerText = PRESET_MNEMONICS[key];
        } else {
            generateHubMnemonic();

    function copyMnemonicResult() {
        const txt = document.getElementById('mnem-output-text').innerText;
        navigator.clipboard.writeText(txt);
    }

    async function generateHubMnemonic(forceApi = false) {
        const inp = document.getElementById('mnem-input-box').value.trim();
        const wrap = document.getElementById('mnem-result-wrapper');
        const out = document.getElementById('mnem-output-text');
        const btn = document.getElementById('btn-run-mnemonic');
        if (!inp) return;

        wrap.style.display = 'block';
        if (!forceApi && PRESET_MNEMONICS[inp]) {
            out.innerText = PRESET_MNEMONICS[inp];
            return;
        }

        btn.disabled = true;
        out.innerText = getLang() === 'en'
            ? '⏳ Creating smart medical mnemonic via MEDCORE AI...'
            : '⏳ جاري ابتكار المختصر الطبي عبر محرك MEDCORE AI...';

        try {
            const res = await fetch(AI_WORKER_ENDPOINT, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                    task: 'mnemonic',
                    lang: getLang(),
                    items: inp
                })
            });
            const data = await res.json();
            const replyText = data.mnemonic || data.explanation || data.reply || data.result || '';
            if (data.success && replyText) {
                out.innerText = replyText;
            } else {
                out.innerText = '❌ ' + (data.error || 'تعذر إنشاء المختصر حالياً.');
            }
        } catch (err) {
            out.innerText = '❌ تعذر الاتصال بمحرك MEDCORE AI.';
        } finally {
            btn.disabled = false;
        }
    }

            `;
            if (roomId) document.getElementById('btn-join-room').onclick = joinRoom;
            else document.getElementById('btn-setup-room').onclick = renderHostSetup;
        };

        const renderHostSetup = () => {
            myName = document.getElementById('arena-player-name').value.trim();
            if (!myName) return alert(isEn ? 'Please enter your name first!' : 'يرجى كتابة اسمك أولاً يا دكتور!');

            cont.innerHTML = `
                <div class="quiz-card" style="max-width:560px; margin:12px auto;">
                    <h2 style="color:var(--gold); margin-top:0; text-align:center;">⚙️ ${isEn ? 'Challenge Room Settings' : 'إعدادات غرفة التحدي'}</h2>

                    <!-- المحاضرة مقفولة تماماً ولا يمكن تغييرها -->
                    <div class="dynamic-section-box" style="margin-bottom:12px;">
                        <small style="color:var(--text-muted); display:block;">🔒 ${isEn ? 'Challenge Lecture (Locked):' : 'محاضرة التحدي (مقفولة تلقائياً):'}</small>
                        <b style="color:var(--gold); font-size:1rem;">🩺 ${escapeHTML(lockedLectureTitle || lockedLectureId)}</b>
                    </div>

                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;">
                        <div>
                            <label style="font-weight:800; font-size:0.84rem; display:block; margin-bottom:4px;">👥 ${isEn ? 'Max Players (Up to 4):' : 'عدد اللاعبين (بحد أقصى 4):'}</label>
                            <select id="arena-max-players" style="width:100%; padding:10px; border-radius:var(--radius-sm); background:var(--surface-elevated); color:var(--text); border:1.5px solid var(--gold); font-weight:800;">
                                <option value="2">2 ${isEn ? 'Players (1 vs 1)' : 'لاعبين (مواجهة ثنائية)'}</option>
                                <option value="3">3 ${isEn ? 'Players' : 'لاعبين'}</option>
                                <option value="4" selected>4 ${isEn ? 'Players (Max)' : 'لاعبين (الحد الأقصى)'}</option>
                            </select>
                        </div>
                        <div>
                            <label style="font-weight:800; font-size:0.84rem; display:block; margin-bottom:4px;">🔢 ${isEn ? 'Questions Count:' : 'عدد الأسئلة:'}</label>
                            <input type="number" id="arena-q-count" value="10" min="1" max="50" style="width:100%; padding:10px; border-radius:var(--radius-sm); background:var(--surface-elevated); color:var(--text); border:1.5px solid var(--border); font-weight:800;">
                        </div>
                    </div>

                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;">
                        <div>
                            <label style="font-weight:800; font-size:0.84rem; display:block; margin-bottom:4px;">⏱️ ${isEn ? 'Time per Question:' : 'وقت السؤال:'}</label>
                            <select id="arena-q-time" style="width:100%; padding:10px; border-radius:var(--radius-sm); background:var(--surface-elevated); color:var(--text); border:1.5px solid var(--border);">
                                <option value="0">${isEn ? 'Untimed' : 'بدون وقت'}</option>
                                <option value="30">30s</option>
                                <option value="45" selected>45s</option>
                                <option value="60">60s</option>
                            </select>
                        </div>
                        <div>
                            <label style="font-weight:800; font-size:0.84rem; display:block; margin-bottom:4px;">⚔️ ${isEn ? 'Play Mode:' : 'نظام اللعب:'}</label>
                            <select id="arena-play-mode" style="width:100%; padding:10px; border-radius:var(--radius-sm); background:var(--surface-elevated); color:var(--text); border:1.5px solid var(--border);">
                                <option value="compete">🔥 ${isEn ? 'Competitive' : 'منافسة فردية سريعة'}</option>
                                <option value="coop">🤝 ${isEn ? 'Co-op Study' : 'تعاوني جماعي'}</option>
                            </select>
                        </div>
                    </div>

                    <button type="button" id="btn-create-room-now" class="btn-nav btn-gold" style="width:100%; padding:13px;">🚀 ${isEn ? 'Create Room Link' : 'توليد رابط الغرفة الآن'}</button>
                </div>
            `;
            document.getElementById('btn-create-room-now').onclick = createRoom;
        };

        const createRoom = async () => {
            const btn = document.getElementById('btn-create-room-now');
            btn.disabled = true;
            const maxPlayers = Math.min(4, Math.max(2, parseInt(document.getElementById('arena-max-players').value, 10) || 4));
            const qCount = Math.max(1, parseInt(document.getElementById('arena-q-count').value, 10) || 10);
            const timerSec = parseInt(document.getElementById('arena-q-time').value, 10) || 0;
            const mode = document.getElementById('arena-play-mode').value;

            const lDoc = await db.collection('lectures').doc(lockedLectureId).get();
            if (!lDoc.exists || !Array.isArray(lDoc.data().questions)) {
                btn.disabled = false;
                return alert('تعذر سحب أسئلة المحاضرة.');
            }
            const selectedQs = [...lDoc.data().questions].sort(() => 0.5 - Math.random()).slice(0, qCount);
            roomId = 'r_' + Math.random().toString(36).substr(2, 6);

            await db.collection('arena_rooms').doc(roomId).set({
                id: roomId,
                lectureId: lockedLectureId,
                lectureTitle: lockedLectureTitle || lDoc.data().title || lockedLectureId,
                hostId: myPlayerId,
                maxPlayers,
                status: 'lobby',
                settings: { timer: timerSec, mode, maxPlayers },
                questions: selectedQs,
                currentQIndex: 0,
                players: {
                    [myPlayerId]: { name: myName, score: 0, finished: false, currentAns: null }
                },
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            renderLobby('host');
        };

        const joinRoom = async () => {
            myName = document.getElementById('arena-player-name').value.trim();
            if (!myName) return alert(isEn ? 'Enter your name first!' : 'اكتب اسمك أولاً!');
            const roomRef = db.collection('arena_rooms').doc(roomId);
            const doc = await roomRef.get();
            if (!doc.exists || doc.data().status !== 'lobby') {
                return alert(isEn ? 'Room unavailable or already started!' : 'الغرفة غير متاحة أو بدأت بالفعل!');
            }
            const d = doc.data();
            const maxAllowed = Math.min(4, Number(d.maxPlayers || d.settings?.maxPlayers || 4));
            const currentPlayersCount = Object.keys(d.players || {}).length;

            if (!d.players?.[myPlayerId] && currentPlayersCount >= maxAllowed) {
                return alert(isEn ? `Room is full! (Max ${maxAllowed} players)` : `الغرفة مكتملة العدد! (الحد الأقصى ${maxAllowed} لاعبين)`);
            }

            await roomRef.update({
                [`players.${myPlayerId}`]: { name: myName, score: 0, finished: false, currentAns: null }
            });
            renderLobby('guest');
        };

        const renderLobby = (role) => {
            if (lobbyUnsub) lobbyUnsub();
            const shareUrl = new URL('index.html', window.location.href);
            shareUrl.searchParams.set('id', lockedLectureId);
            shareUrl.searchParams.set('arena', 'live');
            shareUrl.searchParams.set('room', roomId);

            cont.innerHTML = `
                <div class="quiz-card" style="text-align:center;">
                    <h2 style="color:var(--gold); margin-top:0;">⏳ ${isEn ? 'Waiting Lobby' : 'غرفة الانتظار'}</h2>
                    <p style="font-weight:800; color:var(--gold); margin:0 0 8px 0;">🩺 ${escapeHTML(lockedLectureTitle || lockedLectureId)}</p>
                    <div class="static-section-box" style="margin-bottom:14px;">
                        <small style="display:block; margin-bottom:6px; font-weight:800;">${isEn ? 'Share this invite link with your friends:' : 'شارك رابط الدعوة مع أصدقائك:'}</small>
                        <div style="display:flex; gap:6px;">
                            <input type="text" value="${escapeHTML(shareUrl.href)}" readonly style="flex:1; padding:9px; border-radius:6px; background:var(--surface); color:var(--gold); direction:ltr; border:1px solid var(--border); font-weight:800;">
                            <button type="button" class="btn-nav btn-blue" onclick="navigator.clipboard.writeText('${escapeHTML(shareUrl.href)}')">📋 ${isEn ? 'Copy' : 'نسخ'}</button>
                        </div>
                    </div>
                    <div id="arena-capacity-badge" style="margin-bottom:10px; font-weight:800; font-size:0.86rem; color:var(--text-muted);"></div>
                    <div id="arena-players-grid" style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;"></div>
                    ${role === 'host'
                        ? `<button type="button" id="btn-launch-match" class="btn-nav btn-maroon" style="width:100%; padding:13px;">⚔️ ${isEn ? 'Start Match Now!' : 'ابدأ المعركة الآن!'}</button>`
                        : `<div style="font-weight:800; color:var(--gold);">${isEn ? 'Waiting for host to start...' : 'بانتظار المضيف لبدء التحدي...'}</div>`
                    }
                </div>
            `;

            if (role === 'host') {
                document.getElementById('btn-launch-match').onclick = () => {
                    db.collection('arena_rooms').doc(roomId).update({ status: 'playing', startTime: Date.now() });
                };
            }

            lobbyUnsub = db.collection('arena_rooms').doc(roomId).onSnapshot(doc => {
                const data = doc.data();
                if (!data) return;
                const pIds = Object.keys(data.players || {});
                const maxP = Math.min(4, Number(data.maxPlayers || data.settings?.maxPlayers || 4));
                const capEl = document.getElementById('arena-capacity-badge');
                if (capEl) capEl.innerText = isEn ? `Players in Room: ${pIds.length} / ${maxP}` : `اللاعبون في الغرفة: ${pIds.length} من ${maxP}`;

                const grid = document.getElementById('arena-players-grid');
                if (grid) {
                    grid.innerHTML = pIds.map(pid => `
                        <div class="static-section-box" style="min-width:115px; text-align:center; margin-bottom:0;">
                            <div style="font-size:1.5rem;">${pid === data.hostId ? '👑' : '🩺'}</div>
                            <div style="font-weight:900; font-size:0.86rem;">${escapeHTML(data.players[pid].name)}</div>
                        </div>
                    `).join('');
                }
                if (data.status === 'playing') {
                    if (lobbyUnsub) { lobbyUnsub(); lobbyUnsub = null; }
                    runMatchLoop(data);
                }
            });
        };

        const runMatchLoop = (roomData) => {
            const qs = roomData.questions || [];
            let cIdx = 0;
            let myScore = 0;

            const drawQ = () => {
                if (cIdx >= qs.length) {
                    finishMatch(myScore);
                    return;
                }
                const q = qs[cIdx];
                const opts = [...(q.options || [])].sort(() => 0.5 - Math.random());

                cont.innerHTML = `
                    <div class="stack-card">
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-weight:800; font-size:0.86rem;">
                            <span style="color:var(--gold);">🩺 ${escapeHTML(lockedLectureTitle)}</span>
                            <span>${cIdx + 1} / ${qs.length}</span>
                        </div>
                        <div class="question-text">${q.q}</div>
                        <div id="arena-q-opts" style="display:flex; flex-direction:column; gap:7px;"></div>
                    </div>
                `;
                const box = document.getElementById('arena-q-opts');
                let locked = false;
                opts.forEach((opt, i) => {
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'option';
                    b.dataset.val = opt;
                    b.innerHTML = `<b>${String.fromCharCode(65 + i)}</b> <span>${opt}</span>`;
                    b.onclick = () => {
                        if (locked) return;
                        locked = true;
                        if (opt === q.a) myScore++;
                        db.collection('arena_rooms').doc(roomId).update({
                            [`players.${myPlayerId}.score`]: myScore
                        }).catch(() => {});
                        box.querySelectorAll('.option').forEach(btn => {
                            btn.classList.add('locked-opt');
                            if (btn.dataset.val === q.a) btn.classList.add('ans-correct');
                            else if (btn.dataset.val === opt) btn.classList.add('ans-wrong');
                        });
                        setTimeout(() => { cIdx++; drawQ(); }, 1100);
                    };
                    box.appendChild(b);
                });
            };
            drawQ();
        };

        const finishMatch = (myFinalScore) => {
            const roomRef = db.collection('arena_rooms').doc(roomId);
            roomRef.update({ [`players.${myPlayerId}.finished`]: true }).catch(() => {});
            cont.innerHTML = `<div class="quiz-card" style="text-align:center; padding:32px;"><h3>⏳ ${isEn ? 'Waiting for other players to finish...' : 'بانتظار إنهاء بقية اللاعبين...'}</h3></div>`;

            matchUnsub = roomRef.onSnapshot(doc => {
                const data = doc.data();
                if (!data) return;
                const pls = Object.values(data.players || {});
                if (pls.every(p => p.finished)) {
                    if (matchUnsub) { matchUnsub(); matchUnsub = null; }
                    pls.sort((a, b) => (b.score || 0) - (a.score || 0));
                    cont.innerHTML = `
                        <div class="quiz-card" style="text-align:center;">
                            <div style="font-size:3rem;">🏆</div>
                            <h2 style="color:var(--gold);">${isEn ? 'Final Standings' : 'الترتيب النهائي للمعركة'}</h2>
                            <div style="margin:14px 0; text-align:start;">
                                ${pls.map((p, i) => `
                                    <div class="static-section-box" style="display:flex; justify-content:space-between; margin-bottom:7px;">
                                        <b>#${i + 1} ${escapeHTML(p.name)}</b>
                                        <span class="status-pill">${Number(p.score) || 0}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
            });
        };

        renderEntry();
    }

    window.addEventListener('DOMContentLoaded', () => {
        applyHubThemeAndLang();
        switchHubTab(activeTab);
    });
    </script>
</body>
</html>
